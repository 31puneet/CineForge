version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: cineforge-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: cineforge-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: cineforge-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
      MINIO_CORS_ALLOW_ORIGIN: "http://localhost:5173"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: cineforge-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: cineforge-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=3000
    depends_on:
      - mongodb
      - redis

  ai-service:
    build:
      context: ./ai-service
    container_name: cineforge-ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis

volumes:
  mongo_data:
  minio_data:
