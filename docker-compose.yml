version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: cineforge-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: cineforge-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: cineforge-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
      MINIO_CORS_ALLOW_ORIGIN: "http://localhost:5173"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: cineforge-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_GOOGLE_CLIENT_ID=44764823582-a40es2ece62bg7v4mmsukbgvpb9kcqle.apps.googleusercontent.com
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: cineforge-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=3000
      - NODE_ENV=development
      - MONGO_URI=mongodb://cineforge-mongo:27017/cineforge
      - REDIS_URL=redis://cineforge-redis:6379
      - JWT_SECRET=development_secret_key_change_in_production
      - INTERNAL_API_KEY=development_internal_api_key_123
      - MINIO_ENDPOINT=cineforge-minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - MINIO_USE_SSL=false
      - GOOGLE_CLIENT_ID=44764823582-a40es2ece62bg7v4mmsukbgvpb9kcqle.apps.googleusercontent.com
    depends_on:
      - mongodb
      - redis

  ai-service:
    build:
      context: ./ai-service
    container_name: cineforge-ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
    environment:
      - PYTHONUNBUFFERED=1
      - INTERNAL_API_KEY=development_internal_api_key_123
      - BACKEND_URL=http://cineforge-backend:3000
    depends_on:
      - redis

volumes:
  mongo_data:
  minio_data:
